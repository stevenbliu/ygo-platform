# Push to main -> test -> apply D1 migrations -> deploy to Cloudflare Workers.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Edit Cloudflare Workers" + "D1: Edit" on your account
#   CLOUDFLARE_ACCOUNT_ID  your account id (Workers & Pages overview, right-hand side)
#
# The engine tests need the gitignored data/ folder and skip themselves here; the rest run
# (rules helpers, UI logic, clock, masking, and the bundle-size check against the Worker limit).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a newer push waits for the running one instead of racing it
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run --exclude "**/node_modules/**" --exclude "**/.claude/**"

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi

      # before the new code goes live, so it never runs against a database missing a column
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy
        id: deploy
        run: npm run deploy

      # the live site in a real browser: a demo duel at three window sizes and the summon lab (e2e/smoke.e2e.ts)
      - name: Browser smoke test (live site)
        env:
          BASE_URL: https://ygo-platform.stevenbliu.workers.dev
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      # recorded duel moments (public/scenes/) on the live site: UX rules + accessibility (axe), at desktop and
      # laptop sizes, plus the splash timing check (scripts/ux/scenes.pw.ts). No screenshot diffs here: baselines
      # are per machine, so they're a local check.
      - name: Scene checks (live site)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          BASE_URL: https://ygo-platform.stevenbliu.workers.dev
          SCENE_SHOTS: "0"
        run: npm run scenes

      - name: Keep the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            test-results/
            playwright-report-scenes/
          retention-days: 7
